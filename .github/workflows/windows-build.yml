name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # --- backend sidecar ---
      - name: Install backend
        working-directory: .
        run: python -m pip install -e "./backend[dev]" "pyinstaller==6.22.3" py7zr

      - name: Fetch Pikafish (pinned release)
        working-directory: .
        run: python backend/scripts/fetch_pikafish.py

      - name: Backend tests (incl. engine integration)
        working-directory: backend
        run: python -m pytest -q

      - name: Build backend (PyInstaller, one folder)
        working-directory: backend
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/xqc-backend.spec

      - name: Collect licences
        working-directory: .
        run: python backend/packaging/collect_licenses.py --out backend/dist/licenses

      # Same contract as the app: start, analyse once (starts Pikafish), close stdin -> clean exit.
      - name: Smoke test packaged backend
        working-directory: backend
        run: |
          $env:XQC_PORT = "8799"
          $env:XQC_DB_PATH = "$env:RUNNER_TEMP\smoke\coach.db"
          $env:XQC_PIKAFISH_PATH = "$env:GITHUB_WORKSPACE\engine\pikafish\pikafish.exe"
          $env:XQC_EXIT_ON_STDIN_EOF = "1"
          $psi = [System.Diagnostics.ProcessStartInfo]::new("$PWD\dist\xqc-backend\xqc-backend.exe")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          try {
            $h = $null
            for ($i = 0; $i -lt 60 -and -not $h; $i++) {
              try { $h = Invoke-RestMethod http://127.0.0.1:8799/health } catch { Start-Sleep 1 }
            }
            if ($h.status -ne "ok") { throw "backend /health failed" }
            $e = Invoke-RestMethod http://127.0.0.1:8799/engine/status
            if (-not $e.available) { throw "engine not available: $($e | ConvertTo-Json -Compress)" }
            $body = '{"fen":"rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1","depth":6}'
            $a = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8799/engine/analyze `
              -Headers @{ "X-XQC-Client" = "1" } -ContentType "application/json" -Body $body
            if (-not $a.best_move) { throw "analyze returned no best_move: $($a | ConvertTo-Json -Compress)" }
            $p.StandardInput.Close()
            if (-not $p.WaitForExit(10000)) { throw "backend ignored stdin EOF" }
            if ($p.ExitCode -ne 0) { throw "backend exit code $($p.ExitCode)" }
            if (Get-Process pikafish -ErrorAction SilentlyContinue) { throw "pikafish still running after backend exit" }
          } finally {
            if (-not $p.HasExited) { $p.Kill($true) }
          }

      # --- desktop ---
      - run: npm ci
      - run: npm test
      # Bundle-only resources (backend/, pikafish/, licenses/) come from this overlay so `tauri dev` needs none.
      - run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-coach-windows-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
