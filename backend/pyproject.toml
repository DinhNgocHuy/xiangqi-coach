[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-coach-backend"
dynamic = ["version"]
description = "Local backend for Live Xiangqi Screen Coach"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyffish>=0.0.91",  # Fairy-Stockfish move generator, GPL-3.0
    "anthropic>=2.14",  # AI Thinking Coach (phase 5); built on httpx2
    "httpx2>=2.16",  # Hugging Face Inference Providers client (already installed via anthropic)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "py7zr>=0.21"]  # httpx: FastAPI TestClient; py7zr: fetch_pikafish tests
# scripts/fetch_pikafish.py (extracts the official .7z release)
engine-setup = ["py7zr>=0.21"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (perft depth 3)",
    "engine: needs the real Pikafish binary in engine/pikafish (skipped when missing)",
]
